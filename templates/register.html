<!doctype html>
<html>
<head>
  <title>Create account — Journ</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 360px; margin: 5rem auto; }
    input { display: block; width: 100%; padding: .5rem; margin-top: .5rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: .5rem 1rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Create account</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('register') }}">
    <input type="text" name="username" placeholder="username" autofocus>
    <input type="password" name="password" placeholder="password">
    <button type="submit">Create account</button>
  </form>
  <p><a href="{{ url_for('login') }}">Already have an account? Log in</a></p>
</body>
</html>
