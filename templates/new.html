<!doctype html>
<html>
<head>
  <title>New entry — Journ</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; }
    input, textarea { display: block; width: 100%; padding: .5rem; margin-top: .5rem; box-sizing: border-box; }
    textarea { min-height: 200px; font: inherit; }
    button { margin-top: 1rem; padding: .5rem 1rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>New entry</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('new_entry') }}">
    <input type="text" name="title" placeholder="Title" autofocus>
    <textarea name="body" placeholder="Write your entry..."></textarea>
    <button type="submit">Save</button>
  </form>
  <p><a href="{{ url_for('journal') }}">Back to journal</a></p>
</body>
</html>
